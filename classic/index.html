<!doctype html>
<html lang="uz" data-ui="once" data-theme="dark" data-brand="cyan" data-accent="violet" data-neutral="gray" data-solid="contrast" data-solid-style="flat" data-border="playful" data-surface="filled" data-transition="all" data-scaling="100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <script>
    /* Mavzu sahifa chizilishidan oldin qoʻllanadi: Once UI (asosiy) yoki Glassmorphism */
    (function () {
      var d = document.documentElement, ui = "once", mode = "dark";
      try { ui = localStorage.getItem("pp_ui") || "once"; mode = localStorage.getItem("pp_mode") || "dark"; } catch (e) {}
      if (ui !== "glass") ui = "once";
      if (mode === "system") mode = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      d.setAttribute("data-ui", ui);
      d.setAttribute("data-theme", ui === "once" && mode === "light" ? "light" : "dark");
    })();
  </script>
  <meta name="description" content="Kompyuter holati, fanlar, ekran vaqti va masofaviy boshqaruv">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PC Pulse">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="vendor/once-ui/tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme-once.css">
  <title>PC Pulse</title>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="app"></div>
  <noscript>PC Pulse ishlashi uchun JavaScript kerak.</noscript>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
