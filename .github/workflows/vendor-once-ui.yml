name: Once UI CSS (vaqtinchalik)
on:
  push:
    branches: [tools/once-ui]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir out && cd out
          for p in @once-ui-system/core @once-ui-system/foundations; do
            npm view $p version dist-tags --json > "$(echo $p | tr '/@' '__').json" || true
            npm pack $p 2>/dev/null || true
          done
          ls -la
          for t in *.tgz; do mkdir -p "x_${t%.tgz}" && tar -xzf "$t" -C "x_${t%.tgz}"; done
          find . -name "*.css" -path "*css*" | head -50
          find . -name "LICENSE*" | head
      - uses: actions/upload-artifact@v4
        with:
          name: once-ui
          path: out
